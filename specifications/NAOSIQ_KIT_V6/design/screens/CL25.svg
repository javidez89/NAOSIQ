ght="600">Medio elegido</text><rect x="22.0" y="324.95000000000005" width="386.0" height="50" rx="8" fill="white" stroke="#7A8495" stroke-width="1"/><text x="36.0" y="350.95000000000005" fill="#0B0F1A" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400">Bre-B</text><text x="22.0" y="404.95000000000005" fill="#526071" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Titular</text><rect x="22.0" y="417.80000000000007" width="386.0" height="50" rx="8" fill="white" stroke="#7A8495" stroke-width="1"/><text x="36.0" y="443.80000000000007" fill="#0B0F1A" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400">Titular configurado por Tecno Cell</text><text x="22.0" y="497.80000000000007" fill="#526071" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Dato de pago</text><rect x="22.0" y="510.6500000000001" width="386.0" height="50" rx="8" fill="white" stroke="#7A8495" stroke-width="1"/><text x="36.0" y="536.6500000000001" fill="#0B0F1A" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400">Llave de demostración / NO PAGAR</text><rect x="22" y="577.6500000000001" width="386" height="86" rx="12" fill="#E5E7EB"/><g transform="translate(42,603.6500000000001) scale(1.25)"><path d="M2 5H22V20H2ZM2 10H22M5 15H11" fill="none" stroke="#7C3AED" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="86" y="609.6500000000001" fill="#0B0F1A" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">QR del comercio</text><text x="86" y="632.6500000000001" fill="#526071" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400">Referencia visual. No contiene un destino real de</text><text x="86" y="651.5000000000001" fill="#526071" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400">pago.</text><rect x="22" y="681.6500000000001" width="386" height="120" rx="12" fill="#FFFBEB"/><g transform="translate(38,700.6500000000001) scale(0.8333333333333334)"><path d="M12 3L23 21H1ZM12 9V14M12 17V18" fill="none" stroke="#92400E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="70" y="711.6500000000001" fill="#92400E" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Aún no es un pago confirmado</text><text x="70" y="739.8500000000001" fill="#0B0F1A" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400">Reportar o adjuntar un soporte no acredita</text><text x="70" y="760.1500000000001" fill="#0B0F1A" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400">dinero recibido. El comercio verificará el</text><text x="70" y="780.4500000000002" fill="#0B0F1A" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400">movimiento.</text><rect x="22" y="829.6500000000001" width="386" height="120" rx="12" fill="#F2ECFD"/><g transform="translate(38,848.6500000000001) scale(0.8333333333333334)"><path d="M6 3H15L20 8V21H6ZM14 3V9H20M9 13H17M9 17H17" fill="none" stroke="#7C3AED" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="70" y="859.6500000000001" fill="#7C3AED" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">Tu siguiente paso</text><text x="70" y="887.8500000000001" fill="#0B0F1A" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400">Verifica el titular antes de pagar. En efectivo,</text><text x="70" y="908.1500000000001" fill="#0B0F1A" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400">coordina la atención en el local; no reportes una</text><text x="70" y="928.4500000000002" fill="#0B0F1A" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400">transferencia.</text><g id="CL25.A1" data-action="CL25.A1" role="button" aria-label="Copiar dato de pago" tabindex="0" style="cursor:pointer"><rect x="22" y="967.6500000000001" width="386" height="48" rx="10" fill="white" stroke="#7A8495" stroke-width="1