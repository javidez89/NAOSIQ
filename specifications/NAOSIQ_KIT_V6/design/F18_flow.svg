r el original y mostrar relación.</text><text x="14" y="958.0" fill="#526071" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400">Datos y rutas de demostración. Las entregas a otro rol se revisan como otra sesión; no conceden acceso.</text></svg>