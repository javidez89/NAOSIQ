nal antes de volver a pagar o registrar la recepcion.</text><text x="64" y="907.0" fill="#526071" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400">Este panel es una propuesta visual; no consulta ningun proveedor de pagos.</text><text x="44" y="997.0" fill="#526071" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400">Inter / NAOSIQ v6 / Referencia editable, no biblioteca nativa de Figma.</text></svg>