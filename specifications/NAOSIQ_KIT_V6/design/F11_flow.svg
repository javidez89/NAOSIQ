="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="50" y="800.0" fill="#0B0F1A" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400">TE05.A3 envía diagnóstico; no eleva al Técnico a Administrador.</text><g transform="translate(18,822.2) scale(0.8333333333333334)"><path d="M4 12L9 17L20 6" fill="none" stroke="#0E7490" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="50" y="837.2" fill="#0B0F1A" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400">Sin acceso a cámara, la entrada manual mantiene el flujo.</text><text x="14" y="958.0" fill="#526071" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400">Datos y rutas de demostración. Las entregas a otro rol se revisan como otra sesión; no conceden acceso.</text></svg>